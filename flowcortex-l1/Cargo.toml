[package]
name = "flowcortex-l1"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
# asynchronous runtime and web framework
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
# cryptographic utilities used by QCT stub
sha2 = "0.10"
hex = "0.4"
# WASM runtime for deterministic execution of Capsules
wasmtime = "13"
base64 = "0.21"

# STARK proof verification (Winterfell)
winterfell = "0.8"

# cryptography for wallet authentication
ed25519-dalek = "1"

# HTTP utilities (CORS middleware)
tower-http = { version = "0.3", features = ["cors", "set-header"] }

# gRPC support
tonic = { version = "0.9", features = ["transport"] }
prost = "0.11"

[build-dependencies]
tonic-build = "0.9"
protoc-bin-vendored = "3"

[features]
demo-example = []

# we use hyper::Server in the binary

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }

[[example]]
name = "test_demo"
path = "examples/test_demo.rs"
required-features = ["demo-example"]
