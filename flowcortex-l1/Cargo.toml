[package]
name = "flowcortex-l1"
version = "0.1.0"
edition = "2024"

[dependencies]
# asynchronous runtime and web framework
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
# cryptographic utilities used by QCT stub
sha2 = "0.10"
hex = "0.4"

# HTTP utilities (CORS middleware)
tower-http = { version = "0.3", features = ["cors", "set-header"] }

# we use hyper::Server in the binary

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
