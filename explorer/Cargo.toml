[package]
name = "flowcortex-explorer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
askama = "0.14"
reqwest = { version = "0.11", features = ["json"] }

# hyper is used when launching the HTTP server

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }
