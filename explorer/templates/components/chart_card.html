<!-- Chart Card -->
<div class="card p-6">
    <h3 class="text-lg font-bold mb-4">{{ title }}</h3>
    <div class="relative h-80">
        <canvas id="{{ canvas_id }}"></canvas>
    </div>
    {% if description %}
    <p class="text-xs text-gray-500 dark:text-gray-400 mt-4">{{ description }}</p>
    {% endif %}
</div>
