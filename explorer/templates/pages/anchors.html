{% extends "base.html" %}

{% block page_title %}Anchors & Proofs{% endblock %}
{% block page_subtitle %}Submit and query proof anchors{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
    <!-- Submit Anchor -->
    <div class="card p-6">
        <h3 class="text-lg font-bold mb-4">
            <i class="fas fa-anchor mr-2"></i>Submit Anchor
        </h3>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                Anchor ID
                <span class="text-red-500">*</span>
            </label>
            <input 
                type="text"
                id="anchor-id"
                class="input-field w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700"
                placeholder="anchor_id" 
                />
        </div>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                Proof (Base64)
                <span class="text-red-500">*</span>
            </label>
            <textarea 
                id="anchor-proof"
                class="input-field w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 h-24 font-mono text-xs"
                placeholder="Base64 encoded proof"
                ></textarea>
        </div>

        <button onclick="submitAnchor()" class="button-primary w-full px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
            <i class="fas fa-upload mr-2"></i>Submit
        </button>

        <div id="anchor-submit-output" class="output-box hidden mt-4"></div>
    </div>

    <!-- Get Anchor -->
    <div class="card p-6">
        <h3 class="text-lg font-bold mb-4">
            <i class="fas fa-search mr-2"></i>Get Anchor
        </h3>

        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                Anchor ID
                <span class="text-red-500">*</span>
            </label>
            <input 
                type="text"
                id="get-anchor-id"
                class="input-field w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700"
                placeholder="anchor_id" 
                />
        </div>

        <button onclick="getAnchor()" class="button-primary w-full px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition mb-4">
            <i class="fas fa-search mr-2"></i>Query
        </button>

        <div id="anchor-query-output" class="output-box hidden mt-4"></div>
    </div>

    <!-- List Anchors -->
    <div class="card p-6">
        <h3 class="text-lg font-bold mb-4">
            <i class="fas fa-list mr-2"></i>All Anchors
        </h3>

        <button onclick="listAnchors()" class="button-primary w-full px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition mb-4">
            <i class="fas fa-refresh mr-2"></i>Load All
        </button>

        <div id="anchors-list" class="space-y-2 max-h-96 overflow-y-auto">
            <div class="text-gray-600 dark:text-gray-400 text-center py-4">
                <i class="fas fa-inbox text-lg opacity-50"></i>
                <br/>
                <span class="text-xs">Click "Load All" to view</span>
            </div>
        </div>
    </div>
</div>

<!-- Anchors Output -->
<div class="card p-6">
    <h3 class="text-lg font-bold mb-4">
        <i class="fas fa-terminal mr-2"></i>Output
    </h3>
    <div id="anchors-output" class="output-box hidden mt-4"></div>
    <div id="anchorsEmpty" class="text-gray-600 dark:text-gray-400 text-center py-8">
        <i class="fas fa-inbox text-2xl opacity-50"></i>
        <br/>
        <span class="text-sm">Operation results will appear here</span>
    </div>
</div>
{% endblock %}
