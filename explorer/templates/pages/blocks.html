{% extends "base.html" %}

{% block page_title %}Blocks{% endblock %}
{% block page_subtitle %}Explore blockchain blocks and their data{% endblock %}

{% block content %}
<div class="grid grid-cols-1 lg:grid-cols-4 gap-6 mb-6">
    <!-- Query Controls -->
    <div class="lg:col-span-1">
        <div class="card p-6">
            <h3 class="text-lg font-bold mb-4">
                <i class="fas fa-cogs mr-2"></i>Controls
            </h3>
            
            <button onclick="queryBlocks()" class="button-primary w-full px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition mb-3">
                <i class="fas fa-download mr-2"></i>List Blocks
            </button>

            <button onclick="createBlock()" class="w-full px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                <i class="fas fa-plus mr-2"></i>Create Block
            </button>
        </div>
    </div>

    <!-- Blocks List -->
    <div class="lg:col-span-3">
        <div class="card p-6">
            <h3 class="text-lg font-bold mb-4">
                <i class="fas fa-list mr-2"></i>Block Explorer
            </h3>
            
            <div id="blocks-output" class="output-box hidden mt-4"></div>
            
            <div id="blocks-list" class="space-y-2">
                <div class="text-gray-600 dark:text-gray-400 text-center py-8">
                    <i class="fas fa-inbox text-2xl opacity-50"></i>
                    <br/>
                    <span class="text-sm">Click "List Blocks" to load blocks</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Block Details -->
<div class="card p-6">
    <h3 class="text-lg font-bold mb-4">
        <i class="fas fa-info-circle mr-2"></i>Block Details
    </h3>
    
    <div id="blockDetailsPlaceholder" class="text-gray-600 dark:text-gray-400 text-center py-8">
        <i class="fas fa-inbox text-2xl opacity-50"></i>
        <br/>
        <span class="text-sm">Select a block to view details</span>
    </div>
    
    <div id="blockDetails" class="hidden mt-4"></div>
</div>
{% endblock %}
