<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FlowCortex Explorer</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        h1 { color: #2a6f97; }
        input, button { padding: 0.5rem; margin: 0.2rem; }
        #output { white-space: pre; background: #f4f4f4; padding: 1rem; }
    </style>
</head>
<body>
    <h1>FlowCortex Explorer</h1>
    <p>Basic UI to query the L1 node.</p>
    <div>
        <h2>Balance</h2>
        <input type="text" id="acct" placeholder="account" />
        <input type="text" id="token" placeholder="token (proof/flower)" />
        <button onclick="lookup()">Lookup</button>
    </div>
    <div>
        <h2>Pending Pool</h2>
        <button onclick="pool()">Refresh</button>
    </div>
    <div>
        <h2>Blocks</h2>
        <button onclick="blocks()">Refresh</button>
    </div>
    <div>
        <h2>Snapshot</h2>
        <button onclick="snapshot()">Refresh</button>
    </div>
    <div id="output"></div>

    <script>
        const apiBase = 'http://127.0.0.1:3000';
        function output(o) { document.getElementById('output').textContent = JSON.stringify(o, null, 2); }
        async function lookup() {
            const acct = document.getElementById('acct').value;
            const token = document.getElementById('token').value;
            const res = await fetch(`${apiBase}/balance/${acct}/${token}`);
            const json = await res.json();
            output(json);
        }
        async function pool() {
            const res = await fetch(`${apiBase}/pool`);
            output(await res.json());
        }
        async function blocks() {
            const res = await fetch(`${apiBase}/blocks`);
            output(await res.json());
        }
        async function snapshot() {
            const res = await fetch(`${apiBase}/snapshot`);
            output(await res.json());
        }
    </script>
</body>
</html>
